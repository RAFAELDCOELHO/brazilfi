[project]
name = "brazilfi"
dynamic = ["version"]
description = "Unified Python SDK for Brazilian financial market APIs (Bacen, IBGE, Tesouro Direto, B3, ANBIMA, CVM, IPEA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafael Coelho" }]
keywords = [
    "finance", "brazil", "b3", "bovespa", "bacen", "selic", "ipca", "ibge",
    "tesouro-direto", "anbima", "cvm", "fundos", "dfp", "opcoes", "ipea", "ipeadata", "focus", "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
examples = [
    "matplotlib>=3.8",
]

[project.scripts]
brazilfi = "brazilfi.cli:main"

[project.urls]
Homepage = "https://github.com/RAFAELDCOELHO/brazilfi"
Repository = "https://github.com/RAFAELDCOELHO/brazilfi"
Issues = "https://github.com/RAFAELDCOELHO/brazilfi/issues"
Changelog = "https://github.com/RAFAELDCOELHO/brazilfi/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/brazilfi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brazilfi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=brazilfi --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixtures reproduzem linhas reais dos arquivos da ANBIMA, da CVM e do COTAHIST (245 colunas).
"tests/test_anbima.py" = ["E501"]
"tests/test_b3.py" = ["E501"]
"tests/test_cvm.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.0.260204",
]
